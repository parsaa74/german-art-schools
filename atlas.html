<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2ee"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>German Art Schools</title>
<meta name="description" content="Directory, city map and 12-month application calendar of 767 study programs at 94 German art, design, film, music and media schools.">
<link rel="stylesheet" href="/src/atlas/atlas.css">
</head>
<body data-view="index">
<div class="sheet">
  <aside class="locator" aria-label="Geography">
    <div class="masthead">
      <h1>German Art Schools</h1>
      <p id="count" aria-live="polite"></p>
      <div class="mast-btns">
        <button type="button" id="theme-btn" title="Switch color palette">Palette: Atlas</button>
        <button type="button" id="map-toggle" class="map-toggle" aria-expanded="false">Map</button>
      </div>
    </div>
    <nav class="toc" id="toc" aria-label="Plates"></nav>
    <div class="geo-pane" id="geo-pane">
      <div class="map" id="map"></div>
      <div id="gazetteer"></div>
    </div>
  </aside>
  <main class="ledger">
    <form id="filters" class="colhead" aria-label="Directory columns and filters">
      <div class="c-prog">
        <select name="program" aria-label="Field"></select>
        <input id="find" type="search" placeholder="Filter programs, schools…" aria-label="Filter programs, schools, or cities" autocomplete="off">
      </div>
      <div class="c-school">
        <select name="city" aria-label="City"></select>
      </div>
      <div class="c-deg">
        <select name="degree" aria-label="Degree"></select>
      </div>
      <div class="c-lang">
        <select name="language" aria-label="Language"></select>
      </div>
      <div class="c-when">
        <select name="status" aria-label="Application status">
          <option value="">Window</option>
          <option value="open">Open now</option>
          <option value="dated">Dated only</option>
        </select>
      </div>
      <div class="c-bar" id="axis-head" aria-hidden="true"></div>
    </form>
    <div id="body"></div>
    <footer><p>Compiled from each school's published pages; confirm current dates and requirements with the school. Map: Natural Earth.</p></footer>
  </main>
</div>
<div id="tip" hidden></div>
<script type="module" src="/src/atlas/app.js"></script>
</body></html>
